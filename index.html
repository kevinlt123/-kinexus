<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="KINEXUS">
<title>KINEXUS Expert</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;padding:0;background:#EEF2F5;font-family:Inter,-apple-system,sans-serif;color:#132B3A;overscroll-behavior:none;}
input,select,button,textarea{font-family:Inter,-apple-system,sans-serif;outline:none;}
input[type=number]::-webkit-inner-spin-button{opacity:.6;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:#C7D2DA;border-radius:2px;}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.gh{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){.g2,.gh{grid-template-columns:1fr!important;}}
/* ── PRINT STYLES ─────────────────────────────────────────── */
@media print{
  body{background:#fff!important;color:#111!important;font-size:11pt;}
  .no-print{display:none!important;}
  .print-only{display:block!important;}
  #root{background:#fff;}
  .print-page{page-break-after:always;padding:28px 32px;background:#fff;min-height:100vh;}
  .print-page:last-child{page-break-after:auto;}
  .print-card{background:#f8f9fa!important;border:1px solid #ddd!important;border-radius:8px;padding:12px;margin-bottom:10px;}
  .print-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-weight:700;font-size:9pt;}
  .print-badge.vert{background:#d1fae5;color:#065f46;}
  .print-badge.jaune{background:#fef3c7;color:#92400e;}
  .print-badge.orange{background:#ffedd5;color:#9a3412;}
  .print-badge.rouge{background:#fee2e2;color:#991b1b;}
  .print-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}
  .print-dot.vert{background:#22c55e;}
  .print-dot.jaune{background:#eab308;}
  .print-dot.orange{background:#f97316;}
  .print-dot.rouge{background:#ef4444;}
  .print-fn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .print-fn-item{padding:8px 10px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;}
  .print-fn-item.vert{background:#d1fae5;}
  .print-fn-item.jaune{background:#fef3c7;}
  .print-fn-item.orange{background:#ffedd5;}
  .print-fn-item.rouge{background:#fee2e2;}
  h1,h2,h3{color:#111;}
  .print-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid #2A9D8F;}
  .print-logo{font-weight:900;font-size:18pt;color:#1B4F6A;letter-spacing:-0.02em;}
  .print-subtitle{font-size:9pt;color:#666;margin-top:2px;}
  .print-section-title{font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#1B4F6A;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #2A9D8F40;}
  .print-priority{border-left:4px solid;padding:10px 12px;border-radius:0 6px 6px 0;margin-bottom:8px;background:#f8f9fa;}
  .print-table{width:100%;border-collapse:collapse;font-size:9pt;}
  .print-table th{background:#1B4F6A;color:#fff;padding:6px 8px;text-align:left;font-weight:600;}
  .print-table td{padding:5px 8px;border-bottom:1px solid #eee;}
  .print-table tr:nth-child(even) td{background:#f8f9fa;}
  .print-rtp-box{padding:14px;border-radius:8px;border:2px solid;margin-bottom:12px;}
}
.print-only{display:none;}
</style>

function parseCSV(text){
  var lines=text.trim().split(/\r?\n/);
  if(lines.length<2)return null;
  // Detect delimiter
  var delim=lines[0].includes(';')?';':',';
  var headers=lines[0].split(delim).map(function(h){return h.trim().replace(/^"|"$/g,'').trim();});
  var rows=[];
  for(var i=1;i<lines.length;i++){
    var cells=lines[i].split(delim).map(function(c){return c.trim().replace(/^"|"$/g,'').trim();});
    if(cells.length<2)continue;
    var row={};
    headers.forEach(function(h,j){row[h]=cells[j]||'';});
    rows.push(row);
  }
  return{headers:headers,rows:rows};
}

function detectSource(headers){
  var hl=headers.map(function(x){return x.toLowerCase();});
  var h=hl.join(' ');
  if(hl.indexOf('device')>=0&&hl.indexOf('movement')>=0&&hl.indexOf('body region')>=0)return'dynamo';
  if(hl.indexOf('test type')>=0&&(h.indexOf('bw [kg]')>=0||h.indexOf('externalid')>=0))return'forcedecks';
  if(h.includes('symmetry')||h.includes('forcedeck')||h.includes('limb symmetry'))return'vald';
  if(h.includes('velocity')||h.includes('vitruve')||h.includes('mean velocity'))return'vitruve';
  return'unknown';
}

function fdColSuffix(header){
  var t=header.trim();
  if(/\(asym\)/i.test(t))return'asym';
  if(/\(l\)\s*$/i.test(t))return'L';
  if(/\(r\)\s*$/i.test(t))return'R';
  return null;
}
function fdFindCol(headers,patterns,side){
  for(var i=0;i<patterns.length;i++){
    var p=patterns[i].toLowerCase();
    for(var j=0;j<headers.length;j++){
      var hd=headers[j];
      var hl=hd.toLowerCase();
      if(hl.indexOf(p)!==0)continue;
      // Require a real word boundary right after the pattern (space/bracket/end),
      // so a bare pattern like "Peak Force" or "RSI" doesn't also swallow a more
      // specific column like "Peak Force / BM" or "RSI-modified".
      var boundary=hl.charAt(p.length);
      if(boundary&&boundary!==' '&&boundary!=='('&&boundary!=='['&&boundary!=='/')continue;
      var rest=hl.slice(p.length).replace(/^\s*/,'');
      if(rest.charAt(0)==='/'&&p.indexOf('/')<0)continue;
      var sfx=fdColSuffix(hd);
      if(side===null&&sfx===null)return hd;
      if(side==='L'&&sfx==='L')return hd;
      if(side==='R'&&sfx==='R')return hd;
    }
  }
  return null;
}
function fdVal(raw,kpiLabel,matchedHeader,bw){
  var v=parseFloat(raw);
  if(isNaN(v))return null;
  if(kpiLabel.indexOf('N/kg')>=0&&matchedHeader&&!/\/\s*kg|\/\s*bm/i.test(matchedHeader)&&bw){
    v=v/bw;
  }
  return v;
}
function importForceDecks(parsed){
  var result={};
  var headers=parsed.headers,rows=parsed.rows;
  var typeCol=findCol(headers,['Test Type']);
  var bwCol=findCol(headers,['BW [KG]','BW (KG)','Bodyweight']);
  rows.forEach(function(row){
    var typeVal=typeCol?(row[typeCol]||'').trim():'';
    var testKey=FD_TEST_TYPE_MAP[typeVal.toUpperCase()];
    if(!testKey)return;
    var test=TBK[testKey];if(!test)return;
    var bw=bwCol?parseFloat(row[bwCol]):null;if(isNaN(bw))bw=null;
    if(test.bilateral){
      if(!result[testKey])result[testKey]={active:true,trials:{}};
      test.kpis.forEach(function(kpi){
        var patterns=FD_KPI_PATTERNS[kpi.key];if(!patterns)return;
        var col=fdFindCol(headers,patterns,null);if(!col)return;
        var v=fdVal(row[col],kpi.label,col,bw);
        if(v!=null){if(!result[testKey].trials[kpi.key])result[testKey].trials[kpi.key]=[];result[testKey].trials[kpi.key].push(v);}
      });
    }else{
      if(!result[testKey])result[testKey]={active:true,D:{trials:{}},G:{trials:{}}};
      test.kpis.forEach(function(kpi){
        var patterns=FD_KPI_PATTERNS[kpi.key];if(!patterns)return;
        var colL=fdFindCol(headers,patterns,'L');
        var colR=fdFindCol(headers,patterns,'R');
        if(colL){var vl=fdVal(row[colL],kpi.label,colL,bw);if(vl!=null){if(!result[testKey].G.trials[kpi.key])result[testKey].G.trials[kpi.key]=[];result[testKey].G.trials[kpi.key].push(vl);}}
        if(colR){var vr=fdVal(row[colR],kpi.label,colR,bw);if(vr!=null){if(!result[testKey].D.trials[kpi.key])result[testKey].D.trials[kpi.key]=[];result[testKey].D.trials[kpi.key].push(vr);}}
      });
    }
  });
  return result;
}

// Movement + Body Region (+ Position) -> KINEXUS test key.
function dynamoTestKey(region,movement,position){
  region=(region||'').toLowerCase();movement=(movement||'').toLowerCase();position=(position||'').toLowerCase();
  if(region==='knee'){
    if(movement.indexOf('extension')>=0)return'knee_ext';
    if(movement.indexOf('flexion')>=0)return'knee_flex';
  }
  if(region==='hip'){
    if(movement.indexOf('extension')>=0)return'hip_ext';
    if(movement.indexOf('flexion')>=0)return'hip_flex';
    if(movement.indexOf('abduction')>=0)return'hip_abd';
    if(movement.indexOf('adduction')>=0)return'hip_add';
    if(movement.indexOf('internal rotation')>=0)return'hip_rot_int';
    if(movement.indexOf('external rotation')>=0)return'hip_rot_ext';
  }
  if(region==='ankle'){
    if(movement.indexOf('dorsiflexion')>=0)return'df_iso';
    if(movement.indexOf('inversion')>=0)return'inv_iso';
    if(movement.indexOf('eversion')>=0)return'ev_iso';
    if(movement.indexOf('plantarflexion')>=0)return position.indexOf('extend')>=0?'gastro_iso':'soleus_iso';
  }
  return null;
}
function importDynamo(parsed){
  var result={};
  var headers=parsed.headers,rows=parsed.rows;
  var regionCol=findCol(headers,['Body Region']);
  var moveCol=findCol(headers,['Movement']);
  var posCol=findCol(headers,['Position']);
  var lForceCol=findCol(headers,['L Max Force']);
  var rForceCol=findCol(headers,['R Max Force']);
  var lRfdCol=findCol(headers,['L RFD']);
  var rRfdCol=findCol(headers,['R RFD']);
  var lTtpfCol=findCol(headers,['L Time to Peak Force']);
  var rTtpfCol=findCol(headers,['R Time to Peak Force']);
  rows.forEach(function(row){
    var testKey=dynamoTestKey(regionCol&&row[regionCol],moveCol&&row[moveCol],posCol&&row[posCol]);
    if(!testKey)return;
    var test=TBK[testKey];if(!test)return;
    if(!result[testKey])result[testKey]={active:true,D:{trials:{}},G:{trials:{}}};
    function push(side,kpiKey,raw,mult){
      var v=parseFloat(raw);if(isNaN(v))return;
      if(mult)v=v*mult;
      var bucket=result[testKey][side];
      if(!bucket.trials[kpiKey])bucket.trials[kpiKey]=[];
      bucket.trials[kpiKey].push(v);
    }
    if(lForceCol&&row[lForceCol])push('G','n',row[lForceCol]);
    if(rForceCol&&row[rForceCol])push('D','n',row[rForceCol]);
    if(lRfdCol&&row[lRfdCol])push('G','rfd200',row[lRfdCol]);
    if(rRfdCol&&row[rRfdCol])push('D','rfd200',row[rRfdCol]);
    if(lTtpfCol&&row[lTtpfCol])push('G','ttpf',row[lTtpfCol],1000);
    if(rTtpfCol&&row[rTtpfCol])push('D','ttpf',row[rTtpfCol],1000);
  });
  return result;
}

function findCol(headers,patterns){
  for(var i=0;i<patterns.length;i++){
    var p=patterns[i].toLowerCase();
    for(var j=0;j<headers.length;j++){
      if(headers[j].toLowerCase().includes(p))return headers[j];
    }
  }
  return null;
}

function importVALD(parsed){
  var result={};
  var headers=parsed.headers;
  var rows=parsed.rows;
  // Try to find test name column
  var testCol=findCol(headers,['Test Name','TestName','Exercise','Assessment','Test Type','Metric','Movement']);
  var leftCol=findCol(headers,['Left','L Value','Left Value']);
  var rightCol=findCol(headers,['Right','R Value','Right Value']);
  var bothCol=findCol(headers,['Both','Bilateral','Value','Result','Mean']);
  var lsiCol=findCol(headers,['LSI','Symmetry','Limb Symmetry']);
  rows.forEach(function(row){
    var testName=testCol?row[testCol]:'';
    // Match to our test keys
    Object.keys(VALD_MAP).forEach(function(testKey){
      var patterns=VALD_MAP[testKey];
      var matched=patterns.some(function(p){return testName.toLowerCase().includes(p.toLowerCase());});
      if(!matched)return;
      var test=TBK[testKey];if(!test)return;
      if(!result[testKey])result[testKey]={active:true};
      // Find which KPI this row represents
      var metricCol=findCol(headers,['Metric','KPI','Variable','Measure','Parameter']);
      var metricName=metricCol?row[metricCol]:'';
      test.kpis.forEach(function(kpi){
        var kpiPatterns=VALD_KPI_MAP[kpi.key]||[];
        var kpiMatch=kpiPatterns.some(function(p){return metricName.toLowerCase().includes(p.toLowerCase());});
        // Also try direct column match
        var directCol=findCol(headers,kpiPatterns);
        if(test.bilateral){
          if(!result[testKey].trials)result[testKey].trials={};
          if(!result[testKey].trials[kpi.key])result[testKey].trials[kpi.key]=[];
          var val=bothCol?parseFloat(row[bothCol]):null;
          if(directCol&&!val)val=parseFloat(row[directCol]);
          if(val&&!isNaN(val))result[testKey].trials[kpi.key].push(val);
        } else {
          if(!result[testKey].D)result[testKey].D={trials:{}};
          if(!result[testKey].G)result[testKey].G={trials:{}};
          if(!result[testKey].D.trials[kpi.key])result[testKey].D.trials[kpi.key]=[];
          if(!result[testKey].G.trials[kpi.key])result[testKey].G.trials[kpi.key]=[];
          var lv=leftCol?parseFloat(row[leftCol]):null;
          var rv=rightCol?parseFloat(row[rightCol]):null;
          if(lv&&!isNaN(lv))result[testKey].G.trials[kpi.key].push(lv);
          if(rv&&!isNaN(rv))result[testKey].D.trials[kpi.key].push(rv);
          if(lsiCol){var lsi=parseFloat(row[lsiCol]);if(!isNaN(lsi))result[testKey].lsiAuto=lsi;}
        }
      });
    });
  });
  return result;
}

function importVitruve(parsed){
  var result={};
  var headers=parsed.headers;
  var rows=parsed.rows;
  var exCol=findCol(headers,['Exercise','Ejercicio','Exercice','Movement','Test']);
  var velCol=findCol(headers,['Mean Velocity','Vitesse moyenne','Velocity (m/s)']);
  var loadCol=findCol(headers,['Load','Charge','Weight','kg']);
  rows.forEach(function(row){
    var exName=exCol?row[exCol]:'';
    Object.keys(VITRUVE_MAP).forEach(function(testKey){
      var patterns=VITRUVE_MAP[testKey];
      var matched=patterns.some(function(p){return exName.toLowerCase().includes(p.toLowerCase());});
      if(!matched)return;
      var test=TBK[testKey];if(!test)return;
      if(!result[testKey])result[testKey]={active:true,trials:{}};
      // For profil_fv we collect velocity at different loads
      var vel=velCol?parseFloat(row[velCol]):null;
      var load=loadCol?parseFloat(row[loadCol]):null;
      if(vel&&!isNaN(vel)){
        if(!result[testKey].trials.v0)result[testKey].trials.v0=[];
        result[testKey].trials.v0.push(vel);
      }
    });
  });
  return result;
}

function processCSV(text){
  var parsed=parseCSV(text);
  if(!parsed||!parsed.rows.length)return{error:'Fichier CSV vide ou invalide.',data:null,source:null};
  var source=detectSource(parsed.headers);
  var data={};
  if(source==='forcedecks')data=importForceDecks(parsed);
  else if(source==='dynamo')data=importDynamo(parsed);
  else if(source==='vald')data=importVALD(parsed);
  else if(source==='vitruve')data=importVitruve(parsed);
  else{
    // Try everything: attempt all known formats
    var fd=importForceDecks(parsed);
    var dm=importDynamo(parsed);
    var v=importVALD(parsed);
    var vi=importVitruve(parsed);
    Object.assign(data,v,vi,fd,dm);
    source='generic';
  }
  var count=Object.keys(data).length;
  if(count===0)return{error:'Aucun test reconnu dans ce CSV. Vérifiez le format ForceDecks, DynaMo, VALD ou Vitruve.',data:null,source:source};
  return{error:null,data:data,source:source,count:count};
}

// Poids TFM (test -> fonction) reconstruits à partir du référentiel de raisonnement clinique

// ── RADAR ─────────────────────────────────────────────────────────────────────
function RadarChart(props){
  var fn=props.functionScores;var size=props.size||240;var ref=useRef(null);
  var fns=FUNCTIONS.filter(function(f){return fn[f];});
  useEffect(function(){
    var c=ref.current;if(!c||fns.length<3)return;
    var dpr=window.devicePixelRatio||1;c.width=size*dpr;c.height=size*dpr;c.style.width=size+'px';c.style.height=size+'px';
    var ctx=c.getContext('2d');ctx.scale(dpr,dpr);
    var cx=size/2,cy=size/2,r=Math.min(cx,cy)-58;ctx.clearRect(0,0,size,size);
    var n=fns.length,as=(Math.PI*2)/n,sv={vert:1,jaune:0.67,orange:0.33,rouge:0.1};
    [0.25,0.5,0.75,1].forEach(function(f){ctx.beginPath();fns.forEach(function(_,i){var a=as*i-Math.PI/2;i===0?ctx.moveTo(cx+Math.cos(a)*r*f,cy+Math.sin(a)*r*f):ctx.lineTo(cx+Math.cos(a)*r*f,cy+Math.sin(a)*r*f);});ctx.closePath();ctx.strokeStyle=f===1?'rgba(42,157,143,0.45)':'rgba(27,79,106,0.14)';ctx.lineWidth=f===1?1.5:1;ctx.stroke();});
    fns.forEach(function(_,i){var a=as*i-Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.strokeStyle='rgba(27,79,106,0.16)';ctx.lineWidth=1;ctx.stroke();});
    var pts=fns.map(function(f,i){var sc=fn[f];var val=sc?(sv[sc.status]||0):0;var a=as*i-Math.PI/2;return{x:cx+Math.cos(a)*r*val,y:cy+Math.sin(a)*r*val,f:f,sc:sc};});
    ctx.beginPath();pts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});ctx.closePath();ctx.fillStyle='rgba(42,157,143,0.18)';ctx.fill();ctx.strokeStyle=C.teal;ctx.lineWidth=2;ctx.stroke();
    pts.forEach(function(p){var col=p.sc?SC[p.sc.status]:C.muted;ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();ctx.strokeStyle=C.card;ctx.lineWidth=1.5;ctx.stroke();});
    ctx.textBaseline='middle';
    fns.forEach(function(f,i){var a=as*i-Math.PI/2;var x=cx+Math.cos(a)*(r+15),y=cy+Math.sin(a)*(r+15);var sc=fn[f];ctx.fillStyle=sc?SC[sc.status]:C.muted;ctx.font='bold 7.2px Inter,sans-serif';ctx.textAlign=x<cx-3?'right':x>cx+3?'left':'center';var lines=f.includes(' ')&&f.length>10?f.split(' '):[f];lines.forEach(function(l,li){ctx.fillText(l,x,y+(li-(lines.length-1)/2)*9);});});
  },[fns.length,JSON.stringify(fn)]);
  if(fns.length<3)return h('div',{style:{width:size,height:size,display:'flex',alignItems:'center',justifyContent:'center',color:C.muted,fontSize:12,textAlign:'center',padding:20}},'Saisissez au moins 3 tests pour le radar');
  return h('canvas',{ref:ref,style:{display:'block',maxWidth:'100%'}});
}

// ── CSV IMPORT MODAL ──────────────────────────────────────────────────────────
function CSVImportModal(props){

  var [preview,setPreview]=useState(null);
  var fileRef=useRef(null);

    var file=e.target.files[0];if(!file)return;

        h('div',{style:{fontSize:28,marginBottom:8}},'📂'),

          Object.keys(preview).map(function(k){var t=TBK[k];return h('span',{key:k,style:{padding:'3px 9px',borderRadius:20,background:C.teal+'20',border:'1px solid '+C.teal+'40',color:C.teal,fontSize:11}},t?t.label:k);})
        )

// ── PRINT ENGINE ──────────────────────────────────────────────────────────────
function buildSportifReport(athlete,bilan,res){
  var fSc=res.functionScores,sysSc=res.systemScores,pri=res.priorities,rtp=res.rtpStatus,tSt=res.testStatuses;
  var evFns=FUNCTIONS.filter(function(f){return fSc[f];});
  var td=bilan.testData||{};
  var dateStr=new Date(bilan.date).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  var age=athlete.dateNaissance?Math.floor((Date.now()-new Date(athlete.dateNaissance))/(1000*60*60*24*365.25)):null;

  var colMap={vert:'#22c55e',jaune:'#ca8a04',orange:'#f97316',rouge:'#ef4444'};
  var bgMap={vert:'#d1fae5',jaune:'#fef3c7',orange:'#ffedd5',rouge:'#fee2e2'};
  var txtMap={vert:'#065f46',jaune:'#854d0e',orange:'#9a3412',rouge:'#991b1b'};
  var lblMap={vert:'Optimal',jaune:'À surveiller',orange:'Déficitaire',rouge:'Critique'};
  var SVAL={vert:90,jaune:70,orange:45,rouge:20};
  function badge(s,txt){return '<span style="display:inline-block;padding:2px 9px;border-radius:12px;font-weight:700;font-size:8.5pt;background:'+bgMap[s]+';color:'+txtMap[s]+'">'+(txt||lblMap[s])+'</span>';}
  function sectionTitle(n,title){return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span style="width:20px;height:20px;border-radius:6px;background:#1B4F6A;color:#fff;font-weight:800;font-size:10pt;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+n+'</span><span style="font-size:10.5pt;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;color:#1B4F6A">'+title+'</span></div>';}
  function panel(inner,extraStyle){return '<div style="background:#fff;border:1px solid #E1E8EE;border-radius:12px;padding:16px;'+(extraStyle||'')+'">'+inner+'</div>';}
  function statCol(label,val){return '<div><div style="font-size:6.5pt;letter-spacing:0.08em;text-transform:uppercase;color:#8FAAB8;margin-bottom:2px">'+label+'</div><div style="font-size:8.5pt;color:#fff;font-weight:600">'+val+'</div></div>';}

  // ── Section 1 : dual radar + profil global ──────────────────────────────
  function fnLSI(fn){
    var fk=FN_KEY[fn];var vals=[];
    Object.keys(TFM).forEach(function(tk){
      if(!TFM[tk][fk]||TFM[tk][fk]<2)return;
      var test=TBK[tk];if(!test||test.bilateral)return;
      var data=td[tk];if(!data||!data.active)return;
      var lsi=data.lsiAuto;
      if(lsi==null){var kpi=test.kpis[0];var dV=bestVal(((data.D||{}).trials||{})[kpi.key]||[],kpi.dir);var gV=bestVal(((data.G||{}).trials||{})[kpi.key]||[],kpi.dir);lsi=autoLSI(dV,gV);}
      if(lsi!=null)vals.push(lsi);
    });
    if(!vals.length)return null;
    return Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length);
  }
  var sysLsiByFn={};evFns.forEach(function(fn){sysLsiByFn[fn]=fnLSI(fn);});

  function radarSVG(size){
    var n=evFns.length;if(n<3)return null;
    var mx=48;var vbW=size+mx*2;
    var cx=size/2,cy=size/2,r=size/2-54,as=(Math.PI*2)/n;
    function pt(i,frac){var a=as*i-Math.PI/2;return{x:cx+Math.cos(a)*r*frac,y:cy+Math.sin(a)*r*frac};}
    var svg='<svg viewBox="'+(-mx)+' 0 '+vbW+' '+size+'" width="100%" style="display:block;max-width:'+vbW+'px;margin:0 auto">';
    [0.25,0.5,0.75,1].forEach(function(f){
      var d='';for(var i=0;i<n;i++){var p=pt(i,f);d+=(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)+' ';}
      svg+='<path d="'+d+'Z" fill="none" stroke="'+(f===1?'#2A9D8F80':'#1B4F6A1f')+'" stroke-width="'+(f===1?1.4:1)+'"/>';
    });
    for(var i=0;i<n;i++){var p=pt(i,1);svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p.x.toFixed(1)+'" y2="'+p.y.toFixed(1)+'" stroke="#1B4F6A1f" stroke-width="1"/>';}
    var dAbs='',dSym='';
    evFns.forEach(function(fn,i){
      var val=SVAL[fSc[fn].status]/100;var p=pt(i,val);dAbs+=(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)+' ';
      var symVal=Math.min((sysLsiByFn[fn]!=null?sysLsiByFn[fn]:SVAL[fSc[fn].status])/100,1);var p2=pt(i,symVal);dSym+=(i===0?'M':'L')+p2.x.toFixed(1)+','+p2.y.toFixed(1)+' ';
    });
    svg+='<path d="'+dAbs+'Z" fill="#2A9D8F26" stroke="#2A9D8F" stroke-width="2"/>';
    svg+='<path d="'+dSym+'Z" fill="none" stroke="#1B4F6A" stroke-width="1.6" stroke-dasharray="4,3"/>';
    evFns.forEach(function(fn,i){var val=SVAL[fSc[fn].status]/100;var p=pt(i,val);var col=colMap[fSc[fn].status];svg+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.2" fill="'+col+'" stroke="#fff" stroke-width="1.2"/>';});
    evFns.forEach(function(fn,i){
      var p=pt(i,1.2);var col=colMap[fSc[fn].status];
      var anchor=p.x<cx-3?'end':p.x>cx+3?'start':'middle';
      svg+='<text x="'+p.x.toFixed(1)+'" y="'+(p.y-2).toFixed(1)+'" text-anchor="'+anchor+'" font-size="7.2" font-weight="700" fill="'+col+'" font-family="Arial,sans-serif">'+fn+'</text>';
      svg+='<text x="'+p.x.toFixed(1)+'" y="'+(p.y+9).toFixed(1)+'" text-anchor="'+anchor+'" font-size="7.5" font-weight="800" fill="#1B4F6A" font-family="Arial,sans-serif">'+SVAL[fSc[fn].status]+'%</text>';
    });
    svg+='</svg>';
    return svg;
  }

  // Répartition réelle des statuts par fonction évaluée (comptage, aucune moyenne inventée).
  var statusCount={vert:0,jaune:0,orange:0,rouge:0};
  evFns.forEach(function(fn){statusCount[fSc[fn].status]++;});
  var distBarHtml='';
  if(evFns.length>0){
    distBarHtml='<div style="display:flex;height:16px;border-radius:8px;overflow:hidden;margin-bottom:8px">';
    ['vert','jaune','orange','rouge'].forEach(function(st){
      if(!statusCount[st])return;
      distBarHtml+='<div style="width:'+(statusCount[st]/evFns.length*100)+'%;background:'+colMap[st]+'"></div>';
    });
    distBarHtml+='</div><div style="display:flex;flex-wrap:wrap;gap:8px;font-size:7.8pt;color:#444">';
    ['vert','jaune','orange','rouge'].forEach(function(st){
      if(!statusCount[st])return;
      distBarHtml+='<span><strong style="color:'+colMap[st]+'">'+statusCount[st]+'</strong> '+lblMap[st].toLowerCase()+'</span>';
    });
    distBarHtml+='</div>';
  }
  var globalDesc;
  if(pri.length===0)globalDesc='Profil équilibré, aucun déficit fonctionnel majeur identifié.';
  else{
    var top=pri[0],second=pri[1];
    globalDesc='Déficit principal : '+top.fonction.toLowerCase()+(top.contributeurPrincipal?' ('+top.contributeurPrincipal.toLowerCase()+')':'')+'.'+(second?' Point secondaire : '+second.fonction.toLowerCase()+'.':'');
  }

  var objectifs={Performance:'Optimiser les qualités physiques et prévenir les blessures.',RTP:'Évaluer les critères de retour au sport en sécurité.',Screening:'Dépister les facteurs de risque de blessure.',Suivi:"Suivre l'évolution du profil fonctionnel."};
  var objectifTxt=bilan.commentaire||objectifs[bilan.type]||'Évaluer le profil fonctionnel du sportif.';

  // ── Section 3 : symétrie (LSI) ───────────────────────────────────────────
  var lsiItems=[];
  TESTS.forEach(function(test){
    if(test.bilateral)return;
    var data=td[test.key];if(!data||!data.active)return;
    var kpi=test.kpis[0];
    var dV=bestVal(((data.D||{}).trials||{})[kpi.key]||[],kpi.dir);
    var gV=bestVal(((data.G||{}).trials||{})[kpi.key]||[],kpi.dir);
    var lsi=data.lsiAuto!=null?data.lsiAuto:autoLSI(dV,gV);
    if(lsi!=null&&dV!=null&&gV!=null){
      var unitM=kpi.label.match(/\(([^)]+)\)/);
      lsiItems.push({label:test.label,dV:dV,gV:gV,unit:unitM?unitM[1]:'',lsi:lsi,status:lsiSt(lsi)});
    }
  });

  // ── Section 4 : chaîne causale ────────────────────────────────────────────
  function causalChainHtml(){
    if(!pri.length)return '';
    var nodes=pri.map(function(p){return p.fonction;}).concat(['Impact sur la performance']);
    var out='<div style="display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:14px;padding:12px 14px;background:#F3F6F8;border-radius:10px">';
    out+='<div style="width:100%;font-size:7pt;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#5B7A8C;margin-bottom:2px">Chaîne causale principale identifiée</div>';
    nodes.forEach(function(n,i){
      out+='<div style="padding:6px 10px;border-radius:8px;background:#fff;border:1px solid #E1E8EE;font-size:8.3pt;font-weight:700;color:#1B4F6A">'+n+'</div>';
      if(i<nodes.length-1)out+='<span style="color:#2A9D8F;font-weight:900;font-size:11pt">&#8594;</span>';
    });
    out+='</div>';
    return out;
  }

  // ── Section 5 : retour au sport ──────────────────────────────────────────
  function rtpChecklist(){
    var items=[];
    var rtpKeys=['single_hop','triple_hop','crossover_hop','side_hop','slcmj','sldj'];
    rtpKeys.forEach(function(k){
      var d=td[k];if(!d||!d.active)return;var test=TBK[k];if(!test)return;
      if(!test.bilateral){
        var kpi=test.kpis[0];var dV=bestVal(((d.D||{}).trials||{})[kpi.key]||[],kpi.dir);var gV=bestVal(((d.G||{}).trials||{})[kpi.key]||[],kpi.dir);
        var lsi=d.lsiAuto!=null?d.lsiAuto:autoLSI(dV,gV);
        if(lsi!=null)items.push({label:test.label+' — LSI ≥ 90%',state:lsi>=90?'ok':'ko'});
      }else{
        var st=computeTestStatus(k,d);
        if(st)items.push({label:test.label,state:st==='vert'?'ok':st==='jaune'?'mid':'ko'});
      }
    });
    ['Contrôle Frontal','Mobilité','Absorption'].forEach(function(fn){
      var sc=fSc[fn];if(!sc)return;
      items.push({label:fn+' (norme)',state:sc.status==='vert'?'ok':sc.status==='jaune'?'mid':'ko'});
    });
    return items;
  }
  function checkIcon(state){
    if(state==='ok')return '<span style="color:#22c55e;font-weight:900">&#10003;</span>';
    if(state==='mid')return '<span style="color:#ca8a04;font-weight:900">&#8212;</span>';
    return '<span style="color:#ef4444;font-weight:900">&#10007;</span>';
  }

  // ── Section 6 : indicateurs clés (gauges) ────────────────────────────────
  function gaugeSVG(pct,color,valueText,size){
    size=size||66;var r=size/2-6,cx=size/2,cy=size/2,circ=2*Math.PI*r;
    var dash=circ*Math.min(Math.max(pct,0),100)/100;
    return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#E1E8EE" stroke-width="6"/>'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+dash.toFixed(1)+' '+circ.toFixed(1)+'" transform="rotate(-90 '+cx+' '+cy+')"/>'
      +'<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="11" font-weight="800" fill="'+color+'" font-family="Arial,sans-serif">'+valueText+'</text>'
      +'</svg>';
  }
  function indicatorItems(){
    var out=[];
    var order=['knee_ext','sl_iso_push','slcmj','cmj','ybt','dj','sldj','iso_belt_squat'];
    order.forEach(function(k){

function buildExpertReport(athlete,bilan,res){
  var fSc=res.functionScores,sysSc=res.systemScores,tSt=res.testStatuses,pri=res.priorities,rtp=res.rtpStatus;
  var td=bilan.testData||{};
  var evFns=FUNCTIONS.filter(function(f){return fSc[f];});
  var dateStr=new Date(bilan.date).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  var html='<div class="print-page">';
  html+='<div class="print-header"><div><div class="print-logo">KINEXUS</div><div class="print-subtitle">Rapport Expert</div></div><div style="text-align:right;font-size:9pt;color:#666"><div style="font-weight:700">'+athlete.prenom+' '+athlete.nom+'</div><div>'+bilan.type+' · '+bilan.sousType+'</div><div>'+dateStr+'</div></div></div>';
  // Fonctions table
  html+='<div class="print-section-title">Fonctions évaluées</div>';
  html+='<table class="print-table"><thead><tr><th>Fonction</th><th>Statut</th><th>Couverture</th><th>Confiance</th></tr></thead><tbody>';
  FUNCTIONS.forEach(function(fn){var sc=fSc[fn];if(!sc)return;html+='<tr><td>'+fn+'</td><td><span class="print-badge '+sc.status+'">'+SL[sc.status]+'</span></td><td>'+sc.coverage+'%</td><td>'+sc.confidence+'</td></tr>';});
  html+='</tbody></table></div>';
  // KPI page
  html+='<div class="print-page">';
  html+='<div class="print-header"><div class="print-logo">KINEXUS</div><div style="font-size:9pt;color:#666">Résultats KPI — '+athlete.prenom+' '+athlete.nom+'</div></div>';
  html+='<div class="print-section-title">Résultats bruts par test</div>';
  html+='<table class="print-table"><thead><tr><th>Test</th><th>KPI</th><th>Droite / Valeur</th><th>Gauche</th><th>LSI %</th><th>Statut</th></tr></thead><tbody>';
  Object.keys(td).forEach(function(key){var data=td[key];if(!data||!data.active)return;var test=TBK[key];if(!test)return;var status=tSt[key];test.kpis.forEach(function(kpi){if(test.bilateral){var val=bestVal((data.trials||{})[kpi.key],kpi.dir);html+='<tr><td>'+test.label+'</td><td>'+kpi.label+'</td><td colspan="2" style="text-align:center">'+(val!=null?val:'—')+'</td><td>—</td><td>'+(status?'<span class="print-badge '+status+'">'+SL[status]+'</span>':'')+'</td></tr>';}else{var dV=bestVal(((data.D||{}).trials||{})[kpi.key],kpi.dir);var gV=bestVal(((data.G||{}).trials||{})[kpi.key],kpi.dir);var lsi=data.lsiAuto!=null?data.lsiAuto:'—';html+='<tr><td>'+test.label+'</td><td>'+kpi.label+'</td><td>'+(dV!=null?dV:'—')+'</td><td>'+(gV!=null?gV:'—')+'</td><td>'+lsi+'</td><td>'+(status?'<span class="print-badge '+status+'">'+SL[status]+'</span>':'')+'</td></tr>';}});});
  html+='</tbody></table></div>';
  // Systèmes + Hypothèses + Orientations + RTP
  html+='<div class="print-page">';
  html+='<div class="print-header"><div class="print-logo">KINEXUS</div><div style="font-size:9pt;color:#666">Analyse experte — '+athlete.prenom+' '+athlete.nom+'</div></div>';
  html+='<div class="print-section-title">Systèmes contributeurs</div>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">';
  SYSTEMS.forEach(function(sys){var st=sysSc[sys];if(!st)return;html+='<div class="print-card" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:10pt">'+sys+'</span><span class="print-badge '+st+'">'+SL[st]+'</span></div>';});
  html+='</div>';
  html+='<div class="print-section-title">Hypothèses cliniques</div>';
  pri.forEach(function(p){html+='<div class="print-card" style="margin-bottom:8px"><strong>'+p.fonction+'</strong><p style="margin:4px 0 0;font-style:italic;color:#444">'+p.hypothese+'</p>'+(p.contributeurPrincipal?'<p style="margin:4px 0 0;font-size:9pt;color:#666">Contributeur : '+p.contributeurPrincipal+(p.contributeurSecondaire?' · '+p.contributeurSecondaire:'')+'</p>':'')+'</div>';});
  html+='<div class="print-section-title" style="margin-top:12px">Orientations</div>';
  pri.forEach(function(p){html+='<div class="print-card"><strong>'+p.rang+'. '+p.fonction+'</strong><p style="margin:4px 0 0;color:#333">'+p.orientation+'</p></div>';});

  html+='</div>';
  return html;
}

// ── YBT COMPOSITE CALCULATOR ─────────────────────────────────────────────────
function calcYBT(ant, pm, pl, limbLen) {
  // Composite = (ant + pm + pl) / (3 * limb_length) * 100
  if (ant==null||pm==null||pl==null||!limbLen) return null;
  return Math.round(((ant+pm+pl)/(3*limbLen))*1000)/10;
}

// ── SYMMETRY CHART (bar chart canvas) ────────────────────────────────────────
function SymmetryChart(props) {
  var testData = props.testData || {};
  var ref = useRef(null);

  // Collect all LSI values from active unilateral tests
  var lsiData = [];
  TESTS.forEach(function(test) {
    if (test.bilateral) return;
    var data = testData[test.key];
    if (!data || !data.active) return;
    var lsi = data.lsiAuto;
    if (lsi == null) {
      // Try to compute from best values
      var kpi = test.kpis[0];
      var dV = bestVal(((data.D||{}).trials||{})[kpi.key]||[], kpi.dir);
      var gV = bestVal(((data.G||{}).trials||{})[kpi.key]||[], kpi.dir);
      lsi = autoLSI(dV, gV);
    }
    if (lsi != null) {
      lsiData.push({label: test.label.replace(' Iso','').replace(' Test',''), lsi: lsi, status: lsiSt(lsi)});
    }
  });

  useEffect(function() {
    var canvas = ref.current;
    if (!canvas || !lsiData.length) return;
    var dpr = window.devicePixelRatio || 1;
    var W = canvas.offsetWidth || 400;
    var H = 220;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);

    var padL = 10, padR = 10, padT = 20, padB = 50;
    var chartW = W - padL - padR;
    var chartH = H - padT - padB;
    var barW = Math.min(32, (chartW / lsiData.length) - 6);
    var barGap = chartW / lsiData.length;

    // Background grid lines at 70, 80, 90, 100
    [70, 80, 90, 100].forEach(function(v) {
      var y = padT + chartH - ((v - 60) / 50) * chartH;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y);
      ctx.strokeStyle = v === 90 ? 'rgba(42,157,143,0.4)' : 'rgba(27,79,106,0.10)';
      ctx.lineWidth = v === 90 ? 1.5 : 1; ctx.setLineDash(v === 90 ? [4,3] : []);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = v === 90 ? C.teal : C.muted;
      ctx.font = '9px Inter,sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(v + '%', padL - 2, y + 3);
    });

    // Bars
    lsiData.forEach(function(item, i) {
      var x = padL + i * barGap + (barGap - barW) / 2;
      var pct = Math.min(Math.max(item.lsi, 60), 110);
      var barH2 = ((pct - 60) / 50) * chartH;
      var y = padT + chartH - barH2;
      var color = SC[item.status] || C.muted;

      // Bar
      ctx.fillStyle = color + 'CC';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, barW, barH2, [4,4,0,0]) : ctx.rect(x, y, barW, barH2);
      ctx.fill();

      // Value label on top
      ctx.fillStyle = color;
      ctx.font = 'bold 9px Inter,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(item.lsi + '%', x + barW / 2, y - 4);

      // X label (rotated)
      ctx.save();
      ctx.translate(x + barW / 2, padT + chartH + 8);
      ctx.rotate(-Math.PI / 4);
      ctx.fillStyle = C.muted; ctx.font = '8px Inter,sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(item.label.length > 12 ? item.label.substring(0, 11) + '…' : item.label, 0, 0);
      ctx.restore();
    });

    // 90% threshold label
    ctx.fillStyle = C.teal; ctx.font = 'bold 9px Inter,sans-serif'; ctx.textAlign = 'left';
    var y90 = padT + chartH - ((90 - 60) / 50) * chartH;
    ctx.fillText('Seuil RTP 90%', padL + 4, y90 - 4);

  }, [JSON.stringify(lsiData)]);

  if (!lsiData.length) return h('div',{style:{color:C.muted,fontSize:12,textAlign:'center',padding:'20px'}},'Saisissez des tests bilatéraux avec D et G pour voir les symétries.');

  return h('div',null,
    h('div',{style:{color:C.muted,fontSize:10,fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:10}},'Index de Symétrie (LSI)'),
    h('canvas',{ref:ref,style:{width:'100%',display:'block'}})
  );
}

// ── YBT SPECIAL ENTRY ────────────────────────────────────────────────────────
function YBTEntry(props) {
  var data = props.data || {active:true};
  var onChange = props.onChange;

  function getSideData(side) { return data[side] || {}; }
  function getTrials(side, kpiKey) { return ((getSideData(side).trials)||{})[kpiKey] || []; }

  function updateTrials(side, kpiKey, trials) {
    var newData = Object.assign({}, data);
    var sd = Object.assign({}, getSideData(side));
    sd.trials = Object.assign({}, sd.trials || {});
    sd.trials[kpiKey] = trials;
    // Auto-compute composite for this side if limbLen provided
    var ant = bestVal(sd.trials['ant'] || [], 'max');
    var pm = bestVal(sd.trials['pm'] || [], 'max');
    var pl = bestVal(sd.trials['pl'] || [], 'max');
    var limbLen = newData.limbLen ? parseFloat(newData.limbLen) : null;
    if (ant != null && pm != null && pl != null && limbLen) {
      sd.composite = calcYBT(ant, pm, pl, limbLen);
    }
    newData[side] = sd;
    // LSI on composite
    var cD = (newData.D || {}).composite;
    var cG = (newData.G || {}).composite;
    if (cD != null && cG != null) newData.lsiAuto = autoLSI(cD, cG);
    onChange(newData);
  }

  function setLimbLen(side, val) {
    var newData = Object.assign({}, data);
    var sd = Object.assign({}, getSideData(side));
    sd.limbLen = val;
    // Recompute composite
    var ant = bestVal(getTrials(side,'ant'), 'max');
    var pm = bestVal(getTrials(side,'pm'), 'max');
    var pl = bestVal(getTrials(side,'pl'), 'max');
    var ll = parseFloat(val);
    if (ant != null && pm != null && pl != null && ll) sd.composite = calcYBT(ant, pm, pl, ll);
    newData[side] = sd;
    onChange(newData);
  }

  return h('div', {style:{padding:'0 14px 14px'}},
    h('div', {style:{color:C.muted,fontSize:11,marginBottom:10}}, 'Entrez les 3 directions pour D et G. Le composite est calculé automatiquement si la longueur de membre est renseignée.'),
    h('div', {className:'gh', style:{display:'grid',gap:12}},
      ['D','G'].map(function(side) {
        var sd = getSideData(side);
        var ant = bestVal(getTrials(side,'ant'),'max');
        var pm = bestVal(getTrials(side,'pm'),'max');
        var pl = bestVal(getTrials(side,'pl'),'max');
        var composite = sd.composite;
        return h('div', {key:side, style:{background:C.surface,borderRadius:8,padding:'10px 12px',border:'1px solid '+C.border}},
          h('div',{style:{display:'flex',alignItems:'center',gap:6,marginBottom:10}},
            h('span',{style:{width:22,height:22,borderRadius:'50%',background:side==='D'?C.teal+'30':C.petrol+'60',border:'1.5px solid '+(side==='D'?C.teal:C.petrol),display:'flex',alignItems:'center',justifyContent:'center',color:side==='D'?C.teal:C.muted,fontSize:11,fontWeight:800,flexShrink:0}},side),
            h('span',{style:{color:side==='D'?C.text:C.muted,fontSize:12,fontWeight:600}},side==='D'?'Droite':'Gauche')
          ),
          // Limb length
          h('div',{style:{marginBottom:8}},
            h('div',{style:{color:C.muted,fontSize:10,fontWeight:600,textTransform:'uppercase',marginBottom:3}},'Longueur mb. inf. (cm)'),
            h('input',{type:'number',inputMode:'decimal',step:0.1,value:sd.limbLen||'',
              onChange:function(e){setLimbLen(side,e.target.value);},
              style:{width:'100%',background:C.bg,border:'1px solid '+C.border,borderRadius:6,padding:'6px 9px',color:C.text,fontSize:13,boxSizing:'border-box'}})
          ),
          // 3 directions
          ['ant','pm','pl'].map(function(dir) {
            var labels = {ant:'Antérieur',pm:'Postéro-médial',pl:'Postéro-latéral'};
            var trials = getTrials(side, dir);
            return h(TrialIn,{key:dir,label:labels[dir]+' (cm)',dir:'max',trials:trials,onChange:function(t){updateTrials(side,dir,t);}});
          }),
          // Composite
          composite != null && h('div',{style:{marginTop:8,padding:'6px 10px',borderRadius:6,background:C.teal+'15',border:'1px solid '+C.teal+'30',display:'flex',alignItems:'center',gap:8}},
            h('span',{style:{color:C.muted,fontSize:11}},'Composite :'),
            h('span',{style:{color:C.tealLight,fontWeight:700,fontSize:15}},composite+'%'),
            h(Badge,{status:applyThr('ybt_composite',composite),small:true})
          )
        );
      })
    ),
    // LSI auto

    if(!authUser||authUser.id==='demo')return;
    setSyncing(true);

      if(rows&&rows.length>0){setAthletes(rows);saveData(rows);}
      setSyncing(false);setSyncStatus('ok');
      setTimeout(function(){setSyncStatus(null);},3000);

  },[authUser?authUser.id:null]);

  // Save to localStorage always

    if(!authUser||authUser.id==='demo')return;

    },1500);

    sbSignIn(authEmail,authPwd).then(function(data){
      setAuthUser(data.user);setAuthLoading(false);

      setAuthError(e.message||'Erreur de connexion');setAuthLoading(false);

  }

  function handleSignup(){
    setAuthError('');setAuthLoading(true);
    sbSignUp(authEmail,authPwd).then(function(){
      return sbSignIn(authEmail,authPwd);
    }).then(function(data){
      setAuthUser(data.user);setAuthLoading(false);
    }).catch(function(e){
      setAuthError(e.message||'Erreur. Vérifiez vos informations.');setAuthLoading(false);
    });
  }

  function handleLogout(){
    sbSignOut().then(function(){
      setAuthUser(null);setAthletes(loadData());
    });
  }
  var ca=athletes.find(function(a){return a.id===curId;})||null;

  // ── AUTH SCREEN ────────────────────────────────────────────────────────────
  if(!authUser){

        h('div',{style:{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:28}},
          // Tabs
          h('div',{style:{display:'flex',gap:4,marginBottom:22,background:C.surface,borderRadius:8,padding:3}},
            ['login','signup'].map(function(t){return h('button',{key:t,onClick:function(){setAuthScreen(t);setAuthError('');},style:{flex:1,padding:'7px',borderRadius:6,border:'none',background:authScreen===t?C.petrol:'transparent',color:authScreen===t?C.text:C.muted,fontWeight:600,fontSize:12,cursor:'pointer'}},t==='login'?'Connexion':'Créer un compte');})
          ),
          // Fields
          h('div',{style:{display:'flex',flexDirection:'column',gap:12}},
            h('div',null,
              h('label',{style:{display:'block',color:C.muted,fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:5}},'Email'),
              h('input',{type:'email',value:authEmail,onChange:function(e){setAuthEmail(e.target.value);},placeholder:'vous@exemple.com',
                onKeyDown:function(e){if(e.key==='Enter')authScreen==='login'?handleLogin():handleSignup();},
                style:{width:'100%',background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'10px 12px',color:C.text,fontSize:14,boxSizing:'border-box'}})
            ),
            h('div',null,
              h('label',{style:{display:'block',color:C.muted,fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:5}},'Mot de passe'),
              h('input',{type:'password',value:authPwd,onChange:function(e){setAuthPwd(e.target.value);},placeholder:'••••••••',
                onKeyDown:function(e){if(e.key==='Enter')authScreen==='login'?handleLogin():handleSignup();},
                style:{width:'100%',background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'10px 12px',color:C.text,fontSize:14,boxSizing:'border-box'}})
            ),
            authError&&h('div',{style:{color:C.rouge,fontSize:12,padding:'8px 12px',background:C.rougeBg,borderRadius:6,border:'1px solid '+C.rouge+'30'}},authError),
            h('button',{
              onClick:authScreen==='login'?handleLogin:handleSignup,
              disabled:authLoading||!authEmail||!authPwd,
              style:{width:'100%',padding:'12px',borderRadius:8,border:'none',background:'linear-gradient(135deg,'+C.teal+','+C.petrol+')',color:'#fff',fontWeight:700,fontSize:14,cursor:authLoading||!authEmail||!authPwd?'not-allowed':'pointer',opacity:authLoading||!authEmail||!authPwd?0.6:1}
            },authLoading?'Chargement…':authScreen==='login'?'Se connecter':'Créer mon compte')
          ),
          // Demo mode
          h('div',{style:{marginTop:18,paddingTop:14,borderTop:'1px solid '+C.border,textAlign:'center'}},
            h('button',{onClick:function(){setAuthUser({id:'demo',email:'demo'});},style:{background:'transparent',border:'none',color:C.muted,fontSize:12,cursor:'pointer',textDecoration:'underline'}},'Continuer sans compte (données locales uniquement)')
          )
        ),
        h('div',{style:{textAlign:'center',marginTop:14,color:C.muted,fontSize:10}},'Données chiffrées et sécurisées · Supabase')
      )
    );
  }
  function upBilans(id,fn){setAthletes(function(p){return p.map(function(a){return a.id===id?Object.assign({},a,{bilans:fn(a.bilans||[])}):a;});});}
  function saveAth(a){setAthletes(function(p){return p.find(function(x){return x.id===a.id;})?p.map(function(x){return x.id===a.id?a:x;}):p.concat([a]);});setCurId(a.id);setEditAth(null);setScreen('athlete');}
  function delAth(id){
    setAthletes(function(p){return p.filter(function(a){return a.id!==id;});});
    if(authUser&&authUser.id!=='demo')dbDeleteAthlete(id);
    setScreen('dashboard');
  }
  function saveTests(b){setCurBilan(b);upBilans(curId,function(bil){return bil.filter(function(x){return x.id!==b.id;}).concat([b]);});setScreen('analyse');}
  function validateBilan(){var v=Object.assign({},curBilan,{statut:'Validé'});setCurBilan(v);upBilans(curId,function(bil){return bil.map(function(b){return b.id===v.id?v:b;});});}
  function delBilan(id){upBilans(curId,function(bil){return bil.filter(function(b){return b.id!==id;});});if(curBilan&&curBilan.id===id)setCurBilan(null);setScreen('athlete');}
  function dupBilan(b){var dup=Object.assign({},b,{id:Date.now(),date:new Date().toISOString(),statut:'Brouillon'});upBilans(curId,function(bil){return bil.concat([dup]);});setDraft(dup);setScreen('testEntry');}
  var liveBilan=null;if(curBilan&&ca){var found=ca.bilans&&ca.bilans.find(function(b){return b.id===curBilan.id;});liveBilan=found||curBilan;}
  var LABELS={newAthlete:'Nouveau sportif',editAthlete:'Modifier sportif',newBilan:'Nouveau bilan',testEntry:'Saisie tests',analyse:'Analyse'};
  return h('div',{style:{minHeight:'100vh',background:C.bg}},
    h('div',{className:'no-print',style:{background:C.surface,borderBottom:'1px solid '+C.border,padding:'0 18px',display:'flex',alignItems:'center',height:52,position:'sticky',top:0,zIndex:100,gap:8}},
      h('div',{style:{display:'flex',alignItems:'center',gap:8,cursor:'pointer'},onClick:function(){setScreen('dashboard');}},h('div',{style:{width:26,height:26,borderRadius:6,background:'linear-gradient(135deg,'+C.teal+','+C.petrol+')',display:'flex',alignItems:'center',justifyContent:'center'}},h('span',{style:{color:'#fff',fontSize:12,fontWeight:900}},'K')),h('span',{style:{fontWeight:900,fontSize:15,letterSpacing:'-0.02em',color:C.text}},'KINEXUS'),h('span',{style:{color:C.muted,fontSize:9,letterSpacing:'0.1em'}},'Expert')),
      screen!=='dashboard'&&ca&&h('div',{style:{display:'flex',alignItems:'center',gap:5,overflow:'hidden'}},h('span',{style:{color:C.border}},'›'),h('span',{style:{color:C.teal,fontSize:12,cursor:'pointer'},onClick:function(){setScreen('athlete');}},ca.prenom+' '+ca.nom),screen!=='athlete'&&h('span',null,h('span',{style:{color:C.border,margin:'0 4px'}},'›'),h('span',{style:{color:C.muted,fontSize:11}},LABELS[screen]||screen))),
      h('div',{style:{marginLeft:'auto',display:'flex',alignItems:'center',gap:12}},
        syncing&&h('div',{style:{color:C.teal,fontSize:9,display:'flex',alignItems:'center',gap:4}},
          h('span',{style:{width:6,height:6,borderRadius:'50%',background:C.teal,animation:'pulse 1s infinite'}}),
          'Sync...'
        ),
        syncStatus==='ok'&&h('span',{style:{color:C.vert,fontSize:9}},'✓ Synchronisé'),
        syncStatus==='error'&&h('span',{style:{color:C.orange,fontSize:9}},'⚠ Hors ligne'),
        authUser&&authUser.id!=='demo'&&h('span',{style:{color:C.muted,fontSize:9,maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},authUser.email),
        h('button',{onClick:handleLogout,style:{background:'transparent',border:'1px solid '+C.border,borderRadius:6,padding:'4px 8px',color:C.muted,fontSize:9,cursor:'pointer'}},
          authUser&&authUser.id==='demo'?'Quitter':'Déconnexion'
        )
      )
    ),
    h('div',{style:{maxWidth:880,margin:'0 auto',padding:'22px 16px 80px'}},
      screen==='dashboard'&&h(Dashboard,{athletes:athletes,onSelect:function(a){setCurId(a.id);setScreen('athlete');},onNew:function(){setScreen('newAthlete');},onDelete:delAth}),
      (screen==='newAthlete'||screen==='editAthlete')&&h(AthleteForm,{initial:screen==='editAthlete'?editAth:null,onSave:saveAth,onCancel:function(){setScreen(editAth?'athlete':'dashboard');}}),
      screen==='athlete'&&ca&&h(AthleteProfile,{athlete:ca,onNewBilan:function(){setScreen('newBilan');},onSelectBilan:function(b){setCurBilan(b);setScreen('analyse');},onDeleteBilan:delBilan,onEdit:function(){setEditAth(ca);setScreen('editAthlete');},onDuplicate:dupBilan}),
      screen==='newBilan'&&h(BilanForm,{onSave:function(b){setDraft(b);setScreen('testEntry');},onCancel:function(){setScreen('athlete');}}),
      screen==='testEntry'&&draft&&h(TestEntry,{bilan:draft,onSave:saveTests,onCancel:function(){setScreen('athlete');}}),
      screen==='analyse'&&liveBilan&&ca&&h(AnalyseView,{bilan:liveBilan,athlete:ca,onValidate:validateBilan,onEdit:function(){setDraft(liveBilan);setScreen('testEntry');}})
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
