<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KINEXUS">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;padding:0;background:#EEF2F5;font-family:Inter,-apple-system,sans-serif;color:#132B3A;overscroll-behavior:none;}
input,select,button,textarea{font-family:Inter,-apple-system,sans-serif;outline:none;}
input[type=number]::-webkit-inner-spin-button{opacity:.6;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:#C7D2DA;border-radius:2px;}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.gh{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){.g2,.gh{grid-template-columns:1fr!important;}}
/* ── PRINT STYLES ─────────────────────────────────────────── */
@media print{
  body{background:#fff!important;color:#111!important;font-size:11pt;}
  .no-print{display:none!important;}
  .print-only{display:block!important;}
  #root{background:#fff;}
  .print-page{page-break-after:always;padding:28px 32px;background:#fff;min-height:100vh;}
  .print-page:last-child{page-break-after:auto;}
  .print-card{background:#f8f9fa!important;border:1px solid #ddd!important;border-radius:8px;padding:12px;margin-bottom:10px;}
  .print-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-weight:700;font-size:9pt;}
  .print-badge.vert{background:#d1fae5;color:#065f46;}
  .print-badge.jaune{background:#fef3c7;color:#92400e;}
  .print-badge.orange{background:#ffedd5;color:#9a3412;}
  .print-badge.rouge{background:#fee2e2;color:#991b1b;}
  .print-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}
  .print-dot.vert{background:#22c55e;}
  .print-dot.jaune{background:#eab308;}
  .print-dot.orange{background:#f97316;}
  .print-dot.rouge{background:#ef4444;}
  .print-fn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .print-fn-item{padding:8px 10px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;}
  .print-fn-item.vert{background:#d1fae5;}
  .print-fn-item.jaune{background:#fef3c7;}
  .print-fn-item.orange{background:#ffedd5;}
  .print-fn-item.rouge{background:#fee2e2;}
  h1,h2,h3{color:#111;}
  .print-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid #2A9D8F;}
  .print-logo{font-weight:900;font-size:18pt;color:#1B4F6A;letter-spacing:-0.02em;}
  .print-subtitle{font-size:9pt;color:#666;margin-top:2px;}
  .print-section-title{font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#1B4F6A;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #2A9D8F40;}
  .print-priority{border-left:4px solid;padding:10px 12px;border-radius:0 6px 6px 0;margin-bottom:8px;background:#f8f9fa;}
  .print-table{width:100%;border-collapse:collapse;font-size:9pt;}
  .print-table th{background:#1B4F6A;color:#fff;padding:6px 8px;text-align:left;font-weight:600;}
  .print-table td{padding:5px 8px;border-bottom:1px solid #eee;}
  .print-table tr:nth-child(even) td{background:#f8f9fa;}
  .print-rtp-box{padding:14px;border-radius:8px;border:2px solid;margin-bottom:12px;}
}
.print-only{display:none;}
</style>

function parseCSV(text){
  var lines=text.trim().split(/\r?\n/);
  if(lines.length<2)return null;
  // Detect delimiter
  var delim=lines[0].includes(';')?';':',';
  var headers=lines[0].split(delim).map(function(h){return h.trim().replace(/^"|"$/g,'').trim();});
  var rows=[];
  for(var i=1;i<lines.length;i++){
    var cells=lines[i].split(delim).map(function(c){return c.trim().replace(/^"|"$/g,'').trim();});
    if(cells.length<2)continue;
    var row={};
    headers.forEach(function(h,j){row[h]=cells[j]||'';});
    rows.push(row);
  }
  return{headers:headers,rows:rows};
}

function detectSource(headers){
  var hl=headers.map(function(x){return x.toLowerCase();});
  var h=hl.join(' ');
  if(hl.indexOf('device')>=0&&hl.indexOf('movement')>=0&&hl.indexOf('body region')>=0)return'dynamo';
  if(hl.indexOf('test type')>=0&&(h.indexOf('bw [kg]')>=0||h.indexOf('externalid')>=0))return'forcedecks';
  if(h.includes('symmetry')||h.includes('forcedeck')||h.includes('limb symmetry'))return'vald';
  if(h.includes('velocity')||h.includes('vitruve')||h.includes('mean velocity'))return'vitruve';
  return'unknown';
}

};

var FD_KPI_PATTERNS={
  height:['Jump Height'],rsi_mod:['RSI-modified'],rsi:['RSI'],
  peak_power:['Peak Power / BM','Peak Power/BM','Peak Power'],conc_impulse:['Concentric Impulse'],peak_vel:['Peak Velocity'],

  time_to_stab:['Time to Stabilization','Time to Stabilise']

function fdColSuffix(header){
  var t=header.trim();
  if(/\(asym\)/i.test(t))return'asym';
  if(/\(l\)\s*$/i.test(t))return'L';
  if(/\(r\)\s*$/i.test(t))return'R';
  return null;
}
function fdFindCol(headers,patterns,side){
  for(var i=0;i<patterns.length;i++){
    var p=patterns[i].toLowerCase();
    for(var j=0;j<headers.length;j++){
      var hd=headers[j];
      var hl=hd.toLowerCase();
      if(hl.indexOf(p)!==0)continue;
      // Require a real word boundary right after the pattern (space/bracket/end),
      // so a bare pattern like "Peak Force" or "RSI" doesn't also swallow a more
      // specific column like "Peak Force / BM" or "RSI-modified".
      var boundary=hl.charAt(p.length);
      if(boundary&&boundary!==' '&&boundary!=='('&&boundary!=='['&&boundary!=='/')continue;
      var rest=hl.slice(p.length).replace(/^\s*/,'');
      if(rest.charAt(0)==='/'&&p.indexOf('/')<0)continue;
      var sfx=fdColSuffix(hd);
      if(side===null&&sfx===null)return hd;
      if(side==='L'&&sfx==='L')return hd;
      if(side==='R'&&sfx==='R')return hd;
    }
  }
  return null;
}
function fdVal(raw,kpiLabel,matchedHeader,bw){
  var v=parseFloat(raw);
  if(isNaN(v))return null;
  if(kpiLabel.indexOf('N/kg')>=0&&matchedHeader&&!/\/\s*kg|\/\s*bm/i.test(matchedHeader)&&bw){
    v=v/bw;
  }
  return v;
}
function importForceDecks(parsed){
  var result={};
  var headers=parsed.headers,rows=parsed.rows;
  var typeCol=findCol(headers,['Test Type']);
  var bwCol=findCol(headers,['BW [KG]','BW (KG)','Bodyweight']);
  rows.forEach(function(row){
    var typeVal=typeCol?(row[typeCol]||'').trim():'';
    var testKey=FD_TEST_TYPE_MAP[typeVal.toUpperCase()];
    if(!testKey)return;
    var test=TBK[testKey];if(!test)return;
    var bw=bwCol?parseFloat(row[bwCol]):null;if(isNaN(bw))bw=null;
    if(test.bilateral){
      if(!result[testKey])result[testKey]={active:true,trials:{}};
      test.kpis.forEach(function(kpi){
        var patterns=FD_KPI_PATTERNS[kpi.key];if(!patterns)return;
        var col=fdFindCol(headers,patterns,null);if(!col)return;
        var v=fdVal(row[col],kpi.label,col,bw);
        if(v!=null){if(!result[testKey].trials[kpi.key])result[testKey].trials[kpi.key]=[];result[testKey].trials[kpi.key].push(v);}
      });
    }else{
      if(!result[testKey])result[testKey]={active:true,D:{trials:{}},G:{trials:{}}};
      test.kpis.forEach(function(kpi){
        var patterns=FD_KPI_PATTERNS[kpi.key];if(!patterns)return;
        var colL=fdFindCol(headers,patterns,'L');
        var colR=fdFindCol(headers,patterns,'R');
        if(colL){var vl=fdVal(row[colL],kpi.label,colL,bw);if(vl!=null){if(!result[testKey].G.trials[kpi.key])result[testKey].G.trials[kpi.key]=[];result[testKey].G.trials[kpi.key].push(vl);}}
        if(colR){var vr=fdVal(row[colR],kpi.label,colR,bw);if(vr!=null){if(!result[testKey].D.trials[kpi.key])result[testKey].D.trials[kpi.key]=[];result[testKey].D.trials[kpi.key].push(vr);}}
      });
    }
  });
  return result;
}

// Movement + Body Region (+ Position) -> KINEXUS test key.
function dynamoTestKey(region,movement,position){
  region=(region||'').toLowerCase();movement=(movement||'').toLowerCase();position=(position||'').toLowerCase();
  if(region==='knee'){
    if(movement.indexOf('extension')>=0)return'knee_ext';
    if(movement.indexOf('flexion')>=0)return'knee_flex';
  }
  if(region==='hip'){
    if(movement.indexOf('extension')>=0)return'hip_ext';
    if(movement.indexOf('flexion')>=0)return'hip_flex';
    if(movement.indexOf('abduction')>=0)return'hip_abd';
    if(movement.indexOf('adduction')>=0)return'hip_add';
    if(movement.indexOf('internal rotation')>=0)return'hip_rot_int';
    if(movement.indexOf('external rotation')>=0)return'hip_rot_ext';
  }
  if(region==='ankle'){
    if(movement.indexOf('dorsiflexion')>=0)return'df_iso';
    if(movement.indexOf('inversion')>=0)return'inv_iso';
    if(movement.indexOf('eversion')>=0)return'ev_iso';
    if(movement.indexOf('plantarflexion')>=0)return position.indexOf('extend')>=0?'gastro_iso':'soleus_iso';
  }
  return null;
}
function importDynamo(parsed){
  var result={};
  var headers=parsed.headers,rows=parsed.rows;
  var regionCol=findCol(headers,['Body Region']);
  var moveCol=findCol(headers,['Movement']);
  var posCol=findCol(headers,['Position']);
  var lForceCol=findCol(headers,['L Max Force']);
  var rForceCol=findCol(headers,['R Max Force']);
  var lRfdCol=findCol(headers,['L RFD']);
  var rRfdCol=findCol(headers,['R RFD']);
  var lTtpfCol=findCol(headers,['L Time to Peak Force']);
  var rTtpfCol=findCol(headers,['R Time to Peak Force']);
  rows.forEach(function(row){
    var testKey=dynamoTestKey(regionCol&&row[regionCol],moveCol&&row[moveCol],posCol&&row[posCol]);
    if(!testKey)return;
    var test=TBK[testKey];if(!test)return;
    if(!result[testKey])result[testKey]={active:true,D:{trials:{}},G:{trials:{}}};
    function push(side,kpiKey,raw,mult){
      var v=parseFloat(raw);if(isNaN(v))return;
      if(mult)v=v*mult;
      var bucket=result[testKey][side];
      if(!bucket.trials[kpiKey])bucket.trials[kpiKey]=[];
      bucket.trials[kpiKey].push(v);
    }
    if(lForceCol&&row[lForceCol])push('G','n',row[lForceCol]);
    if(rForceCol&&row[rForceCol])push('D','n',row[rForceCol]);
    if(lRfdCol&&row[lRfdCol])push('G','rfd200',row[lRfdCol]);
    if(rRfdCol&&row[rRfdCol])push('D','rfd200',row[rRfdCol]);
    if(lTtpfCol&&row[lTtpfCol])push('G','ttpf',row[lTtpfCol],1000);
    if(rTtpfCol&&row[rTtpfCol])push('D','ttpf',row[rTtpfCol],1000);
  });
  return result;
}

function findCol(headers,patterns){
  for(var i=0;i<patterns.length;i++){
    var p=patterns[i].toLowerCase();
    for(var j=0;j<headers.length;j++){
      if(headers[j].toLowerCase().includes(p))return headers[j];
    }
  }
  return null;
}

    var testName=testCol?row[testCol]:'';
    // Match to our test keys
    Object.keys(VALD_MAP).forEach(function(testKey){
      var patterns=VALD_MAP[testKey];
      var matched=patterns.some(function(p){return testName.toLowerCase().includes(p.toLowerCase());});
      if(!matched)return;
      var test=TBK[testKey];if(!test)return;
      if(!result[testKey])result[testKey]={active:true};
      // Find which KPI this row represents
      var metricCol=findCol(headers,['Metric','KPI','Variable','Measure','Parameter']);
      var metricName=metricCol?row[metricCol]:'';
      test.kpis.forEach(function(kpi){
        var kpiPatterns=VALD_KPI_MAP[kpi.key]||[];
        var kpiMatch=kpiPatterns.some(function(p){return metricName.toLowerCase().includes(p.toLowerCase());});
        // Also try direct column match
        var directCol=findCol(headers,kpiPatterns);
        if(test.bilateral){
          if(!result[testKey].trials)result[testKey].trials={};
          if(!result[testKey].trials[kpi.key])result[testKey].trials[kpi.key]=[];
          var val=bothCol?parseFloat(row[bothCol]):null;
          if(directCol&&!val)val=parseFloat(row[directCol]);
          if(val&&!isNaN(val))result[testKey].trials[kpi.key].push(val);
        } else {
          if(!result[testKey].D)result[testKey].D={trials:{}};
          if(!result[testKey].G)result[testKey].G={trials:{}};
          if(!result[testKey].D.trials[kpi.key])result[testKey].D.trials[kpi.key]=[];
          if(!result[testKey].G.trials[kpi.key])result[testKey].G.trials[kpi.key]=[];
          var lv=leftCol?parseFloat(row[leftCol]):null;
          var rv=rightCol?parseFloat(row[rightCol]):null;
          if(lv&&!isNaN(lv))result[testKey].G.trials[kpi.key].push(lv);
          if(rv&&!isNaN(rv))result[testKey].D.trials[kpi.key].push(rv);
          if(lsiCol){var lsi=parseFloat(row[lsiCol]);if(!isNaN(lsi))result[testKey].lsiAuto=lsi;}
        }
      });
    });
  });
  return result;
}

function importVitruve(parsed){
  var result={};
  var headers=parsed.headers;
  var rows=parsed.rows;
  var exCol=findCol(headers,['Exercise','Ejercicio','Exercice','Movement','Test']);
  var velCol=findCol(headers,['Mean Velocity','Vitesse moyenne','Velocity (m/s)']);
  var loadCol=findCol(headers,['Load','Charge','Weight','kg']);
  rows.forEach(function(row){
    var exName=exCol?row[exCol]:'';
    Object.keys(VITRUVE_MAP).forEach(function(testKey){
      var patterns=VITRUVE_MAP[testKey];
      var matched=patterns.some(function(p){return exName.toLowerCase().includes(p.toLowerCase());});
      if(!matched)return;
      var test=TBK[testKey];if(!test)return;
      if(!result[testKey])result[testKey]={active:true,trials:{}};
      // For profil_fv we collect velocity at different loads
      var vel=velCol?parseFloat(row[velCol]):null;
      var load=loadCol?parseFloat(row[loadCol]):null;
      if(vel&&!isNaN(vel)){
        if(!result[testKey].trials.v0)result[testKey].trials.v0=[];
        result[testKey].trials.v0.push(vel);
      }
    });
  });
  return result;
}

function processCSV(text){
  var parsed=parseCSV(text);
  if(!parsed||!parsed.rows.length)return{error:'Fichier CSV vide ou invalide.',data:null,source:null};
  var source=detectSource(parsed.headers);
  var data={};
  if(source==='forcedecks')data=importForceDecks(parsed);
  else if(source==='dynamo')data=importDynamo(parsed);
  else if(source==='vald')data=importVALD(parsed);
  else if(source==='vitruve')data=importVitruve(parsed);
  else{
    // Try everything: attempt all known formats
    var fd=importForceDecks(parsed);
    var dm=importDynamo(parsed);
    var v=importVALD(parsed);
    var vi=importVitruve(parsed);
    Object.assign(data,v,vi,fd,dm);
    source='generic';
  }
  var count=Object.keys(data).length;
  if(count===0)return{error:'Aucun test reconnu dans ce CSV. Vérifiez le format ForceDecks, DynaMo, VALD ou Vitruve.',data:null,source:source};
  return{error:null,data:data,source:source,count:count};
}

// ── YBT COMPOSITE CALCULATOR ─────────────────────────────────────────────────
function calcYBT(ant, pm, pl, limbLen) {
  // Composite = (ant + pm + pl) / (3 * limb_length) * 100
  if (ant==null||pm==null||pl==null||!limbLen) return null;
  return Math.round(((ant+pm+pl)/(3*limbLen))*1000)/10;
}

// ── SYMMETRY CHART (bar chart canvas) ────────────────────────────────────────
function SymmetryChart(props) {
  var testData = props.testData || {};
  var ref = useRef(null);

  // Collect all LSI values from active unilateral tests
  var lsiData = [];
  TESTS.forEach(function(test) {
    if (test.bilateral) return;
    var data = testData[test.key];
    if (!data || !data.active) return;
    var lsi = data.lsiAuto;
    if (lsi == null) {
      // Try to compute from best values
      var kpi = test.kpis[0];
      var dV = bestVal(((data.D||{}).trials||{})[kpi.key]||[], kpi.dir);
      var gV = bestVal(((data.G||{}).trials||{})[kpi.key]||[], kpi.dir);
      lsi = autoLSI(dV, gV);
    }
    if (lsi != null) {
      lsiData.push({label: test.label.replace(' Iso','').replace(' Test',''), lsi: lsi, status: lsiSt(lsi)});
    }
  });

  useEffect(function() {
    var canvas = ref.current;
    if (!canvas || !lsiData.length) return;
    var dpr = window.devicePixelRatio || 1;
    var W = canvas.offsetWidth || 400;
    var H = 220;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);

    var padL = 10, padR = 10, padT = 20, padB = 50;
    var chartW = W - padL - padR;
    var chartH = H - padT - padB;
    var barW = Math.min(32, (chartW / lsiData.length) - 6);
    var barGap = chartW / lsiData.length;

    // Background grid lines at 70, 80, 90, 100
    [70, 80, 90, 100].forEach(function(v) {
      var y = padT + chartH - ((v - 60) / 50) * chartH;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y);
      ctx.strokeStyle = v === 90 ? 'rgba(42,157,143,0.4)' : 'rgba(27,79,106,0.10)';
      ctx.lineWidth = v === 90 ? 1.5 : 1; ctx.setLineDash(v === 90 ? [4,3] : []);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = v === 90 ? C.teal : C.muted;
      ctx.font = '9px Inter,sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(v + '%', padL - 2, y + 3);
    });

    // Bars
    lsiData.forEach(function(item, i) {
      var x = padL + i * barGap + (barGap - barW) / 2;
      var pct = Math.min(Math.max(item.lsi, 60), 110);
      var barH2 = ((pct - 60) / 50) * chartH;
      var y = padT + chartH - barH2;
      var color = SC[item.status] || C.muted;

      // Bar
      ctx.fillStyle = color + 'CC';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, barW, barH2, [4,4,0,0]) : ctx.rect(x, y, barW, barH2);
      ctx.fill();

      // Value label on top
      ctx.fillStyle = color;
      ctx.font = 'bold 9px Inter,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(item.lsi + '%', x + barW / 2, y - 4);

      // X label (rotated)
      ctx.save();
      ctx.translate(x + barW / 2, padT + chartH + 8);
      ctx.rotate(-Math.PI / 4);
      ctx.fillStyle = C.muted; ctx.font = '8px Inter,sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(item.label.length > 12 ? item.label.substring(0, 11) + '…' : item.label, 0, 0);
      ctx.restore();
    });

    // 90% threshold label
    ctx.fillStyle = C.teal; ctx.font = 'bold 9px Inter,sans-serif'; ctx.textAlign = 'left';
    var y90 = padT + chartH - ((90 - 60) / 50) * chartH;
    ctx.fillText('Seuil RTP 90%', padL + 4, y90 - 4);

  }, [JSON.stringify(lsiData)]);

  if (!lsiData.length) return h('div',{style:{color:C.muted,fontSize:12,textAlign:'center',padding:'20px'}},'Saisissez des tests bilatéraux avec D et G pour voir les symétries.');

  return h('div',null,
    h('div',{style:{color:C.muted,fontSize:10,fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:10}},'Index de Symétrie (LSI)'),
    h('canvas',{ref:ref,style:{width:'100%',display:'block'}})
  );
}

function YBTEntry(props) {
  var data = props.data || {active:true};
  var onChange = props.onChange;

  function updateTrials(side, kpiKey, trials) {
    var newData = Object.assign({}, data);
    var sd = Object.assign({}, getSideData(side));
    sd.trials = Object.assign({}, sd.trials || {});

    var ant = bestVal(sd.trials['ant'] || [], 'max');
    var pm = bestVal(sd.trials['pm'] || [], 'max');

    var pl = bestVal(getTrials(side,'pl'), 'max');

            h('span',{style:{color:side==='D'?C.text:C.muted,fontSize:12,fontWeight:600}},side==='D'?'Droite':'Gauche')
          ),
          // Limb length
          h('div',{style:{marginBottom:8}},
            h('div',{style:{color:C.muted,fontSize:10,fontWeight:600,textTransform:'uppercase',marginBottom:3}},'Longueur mb. inf. (cm)'),
            h('input',{type:'number',inputMode:'decimal',step:0.1,value:sd.limbLen||'',
              onChange:function(e){setLimbLen(side,e.target.value);},
              style:{width:'100%',background:C.bg,border:'1px solid '+C.border,borderRadius:6,padding:'6px 9px',color:C.text,fontSize:13,boxSizing:'border-box'}})
